<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Conta Bancária</title>
  </head>
  <body>
    <h2>Cadastro de Conta Bancária</h2>
    <form action="index.php" method="post">
      <label for="agencia">Agência:</label>
      <input type="text" id="agencia" name="agencia" /><br /><br />

      <label for="numero">Conta:</label>
      <input type="text" id="numero" name="numero" /><br /><br />

      <label for="nome_cliente">Nome do Cliente:</label>
      <input type="text" id="nome_cliente" name="nome_cliente" /><br /><br />

      <label for="saldo_atual">Saldo Atual:</label>
      <input
        type="number"
        step="0.01"
        id="saldo_atual"
        name="saldo_atual"
      /><br /><br />

      <label for="ultima_movimentacao">Última Movimentação:</label>
      <input
        type="date"
        id="ultima_movimentacao"
        name="ultima_movimentacao"
      /><br /><br />

      <input type="submit" value="Criar Conta" />
    </form>
  </body>
</html>
